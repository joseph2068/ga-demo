<!DOCTYPE html>
<!-- 長照博覽會：掃 QR Code 加入 LINE 好友（單頁） -->
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <!-- 讓手機也能正常顯示 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>加入 LINE｜凱基人壽 吳嘉豐</title>
  <!-- 樣式完全獨立放在 style.css -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ===== 頁首：顯示業務員資訊 ===== -->
  <header class="header">
    <p class="brand">凱基人壽</p>
    <h1 class="title">長照保障．健康人生</h1>
    <p class="subtitle">專屬顧問　吳嘉豐　為您服務</p>
  </header>

  <!-- ===== 主要內容：加入 LINE 卡片 ===== -->
  <main class="container">
    <section class="card line-card">
      <h2 class="card-title">加入我的 LINE 👋</h2>
      <p class="card-note">歡迎掃描下方 QR Code 加入吳嘉豐顧問的 LINE，為您提供專屬長照規劃諮詢。</p>

      <!-- QR Code 圖片直接放在根目錄：line-qr.png -->
      <img class="qr" src="line-qr.png" alt="LINE 加入好友 QR Code"
           onerror="this.style.display='none'" />

      <!-- 加入好友按鈕：請把下方網址換成您的 LINE 加好友連結 -->
      <a class="line-btn"
         href="https://line.me/R/ti/p/@你的LINE_ID"
         target="_blank" rel="noopener">點我加入 LINE 好友</a>

      <p class="card-small">凱基人壽　專屬顧問　吳嘉豐</p>
    </section>
  </main>

  <!-- ===== 頁尾 ===== -->
  <footer class="footer">
    <p>凱基人壽｜本頁僅供長照諮詢聯繫使用。</p>
  </footer>
</body>
</html>
